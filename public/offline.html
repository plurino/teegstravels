<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline • Teegs Travels</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0d0d0e;
      color: #ededed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      max-width: 380px;
      padding: 32px 24px;
      margin: 16px;
      border-radius: 24px;
      background: #141416;
      border: 1px solid #262626;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #f59e0b;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.25);
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 10px;
      color: #ffffff;
    }
    p {
      font-size: 13px;
      color: #a3a3a3;
      line-height: 1.6;
      margin: 0 0 24px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      box-sizing: border-box;
      padding: 12px 20px;
      border-radius: 14px;
      background: #e11d48;
      color: #ffffff;
      font-weight: 600;
      font-size: 13px;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">No Internet Connection</div>
    <h1>You&apos;re Traveling Off-Grid</h1>
    <p>
      Looks like you&apos;re deep in the jungle or on a remote ferry with no signal! Check your connection and try refreshing when you&apos;re back online.
    </p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
